<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外语词汇表工作台</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1a1a1a; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --line:#e5e7eb;
    --new:#3b82f6; --learning:#f59e0b; --mastered:#10b981;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 70px}
  header{text-align:center;margin-bottom:22px}
  header h1{font-size:26px;font-weight:700}
  header p{color:var(--muted);margin-top:6px;font-size:14px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-top:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db}
  .dot.on{background:#10b981}
  .maker{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .maker .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .maker .row>*{flex:1 1 160px}
  .maker input[type=file]{display:none}
  .file-btn{display:inline-block;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;
    cursor:pointer;font-size:13px;color:var(--muted);text-align:center;background:#fafbfc}
  .file-btn.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
  .btn{padding:10px 20px;border:none;border-radius:10px;background:var(--brand);color:#fff;
    font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{opacity:.92}.btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:#374151}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .progress{margin-top:12px;display:none}
  .progress-bar-wrap{height:18px;background:#eef0f3;border-radius:999px;overflow:hidden}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--brand),#60a5fa);transition:width .4s ease;border-radius:999px}
  .progress-label{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar h2{font-size:16px;margin-right:auto}
  .search{flex:0 0 220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .tabs{display:flex;gap:6px}
  .tab{padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer;
    background:#fff;color:var(--muted);transition:.15s}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .list{display:flex;flex-direction:column;gap:8px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
    cursor:pointer;transition:.15s;border-left:4px solid var(--new)}
  .entry:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .entry.learning{border-left-color:var(--learning)}
  .entry.mastered{border-left-color:var(--mastered)}
  .entry .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .entry .word{font-size:17px;font-weight:700}
  .entry .pos{font-size:12px;color:var(--brand);font-weight:600}
  .entry .ipa{font-family:Consolas,monospace;font-size:13px;color:var(--muted)}
  .entry .gloss{font-size:13px;color:#374151;margin-top:4px}
  .entry .gloss-en{font-size:12px;color:var(--muted);margin-top:2px}
  .meta{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .cefr{font-size:11px;font-weight:700;color:#fff;padding:1px 7px;border-radius:4px}
  .freq{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:4px}
  .srs-dot{width:10px;height:10px;border-radius:50%;background:var(--new)}
  .srs-dot.learning{background:var(--learning)}.srs-dot.mastered{background:var(--mastered)}
  .detail{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:13px}
  .entry.open .detail{display:block}
  .detail .row{margin:6px 0}
  .detail .lab{font-weight:600;color:var(--brand);font-size:12px}
  .detail .ex{font-style:italic;color:#374151;margin:4px 0 4px 8px;border-left:2px solid var(--line);padding-left:8px}
  .detail .ex .zh{font-style:normal;color:var(--muted)}
  .srs-btns{display:flex;gap:8px;margin-top:8px}
  .srs-btn{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#fff}
  .srs-btn.new.active{background:var(--new);color:#fff;border-color:var(--new)}
  .srs-btn.learning.active{background:var(--learning);color:#fff;border-color:var(--learning)}
  .srs-btn.mastered.active{background:var(--mastered);color:#fff;border-color:var(--mastered)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px}
  .pager .pg{padding:6px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff;font-size:13px}
  .pager .pg:disabled{opacity:.4;cursor:not-allowed}
  .pager .info{font-size:13px;color:var(--muted)}
  .empty{color:#c0c5cd;text-align:center;padding:60px 20px;font-size:14px}
  .spinner{margin:40px auto;width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>外语词汇表工作台</h1>
    <p>上传英文书籍 PDF → 生成词汇表 → 交互式浏览（翻页 · 点击查词 · SRS 三态标记）</p>
    <div class="status"><span class="dot" id="llmDot"></span><span id="llmStatus">检测 LLM…</span></div>
  </header>

  <div class="maker">
    <div class="row">
      <label class="file-btn" id="fileBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> 选择 PDF 文件<span id="fileName" style="display:block;font-size:11px;margin-top:2px"></span></label>
      <input type="file" id="file" accept=".pdf">
      <select id="preset">
        <option value="">水平档位：自动</option>
      </select>
      <button class="btn" id="genBtn" onclick="generate()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg> 制作词汇表</button>
    </div>
    <div class="note" id="genNote">上传 PDF 后点击「制作词汇表」（长任务约 1-3 分钟，后台生成 + 轮询进度，刷新页面不丢任务）。</div>
    <div class="progress" id="progressWrap">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">排队中…</div>
    </div>
  </div>

  <div class="toolbar">
    <h2 id="bookTitle">词条列表</h2>
    <input class="search" id="search" placeholder="搜索单词 / 释义…" oninput="debounceLoad()">
    <div class="tabs" id="tabs">
      <span class="tab active" data-s="">全部</span>
      <span class="tab" data-s="new"><svg viewBox="0 0 12 12" width="10" height="10" style="vertical-align:-1px"><circle cx="6" cy="6" r="5" fill="#3b82f6"/></svg> 生词</span>
      <span class="tab" data-s="learning"><svg viewBox="0 0 12 12" width="10" height="10" style="vertical-align:-1px"><circle cx="6" cy="6" r="5" fill="#f59e0b"/></svg> 学习中</span>
      <span class="tab" data-s="mastered"><svg viewBox="0 0 12 12" width="10" height="10" style="vertical-align:-1px"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#9ca3af" stroke-width="1.6"/></svg> 已掌握</span>
    </div>
    <button class="btn ghost" id="dlBtn" style="display:none" onclick="downloadFiles()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载产物</button>
  </div>

  <div id="list" class="list"><div class="empty">上传并生成词汇表后，这里会显示可翻页、可点击的词条</div></div>

  <div class="pager" id="pager" style="display:none">
    <button class="pg" onclick="goPage(page-1)" id="prev">← 上一页</button>
    <span class="info" id="pageInfo"></span>
    <button class="pg" onclick="goPage(page+1)" id="next">下一页 →</button>
  </div>
</div>

<script>
const ICONS={
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  zap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  'dot-new':'<svg viewBox="0 0 12 12" width="11" height="11"><circle cx="6" cy="6" r="5" fill="#3b82f6"/></svg>',
  'dot-learning':'<svg viewBox="0 0 12 12" width="11" height="11"><circle cx="6" cy="6" r="5" fill="#f59e0b"/></svg>',
  'dot-mastered':'<svg viewBox="0 0 12 12" width="11" height="11"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#9ca3af" stroke-width="1.6"/></svg>',
};
function ic(n,s){return (ICONS[n]||'').replace('viewBox','width="'+(s||14)+'" height="'+(s||14)+'" viewBox')}

let page=1,pageSize=20,totalPages=1,curStatus='',curQ='';
let lastHtml='',lastPdf='',lastAccessories=[];
let timer=null;

fetch('/api/health').then(r=>r.json()).then(d=>{
  document.getElementById('llmDot').className='dot'+(d.llm_available?' on':'');
  document.getElementById('llmStatus').textContent=d.llm_available?'LLM 已连接（DeepSeek）':'LLM 未连接（离线词库模式）';
}).catch(()=>document.getElementById('llmStatus').textContent='后端未启动');

fetch('/api/presets').then(r=>r.json()).then(d=>{
  if(d.ok){
    const sel=document.getElementById('preset');
    const ps=d.presets;
    const arr=Array.isArray(ps)?ps:Object.keys(ps||{});
    arr.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});
  }
}).catch(()=>{});

document.getElementById('fileBtn').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];
  if(f){document.getElementById('fileName').textContent=f.name;
    document.getElementById('fileBtn').classList.add('on');}
};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');curStatus=t.dataset.s;page=1;loadEntries();
});

async function generate(){
  const f=document.getElementById('file').files[0];
  if(!f){alert('请先选择 PDF 文件');return;}
  const btn=document.getElementById('genBtn');
  const note=document.getElementById('genNote');
  const pwrap=document.getElementById('progressWrap');
  const pbar=document.getElementById('progressBar');
  const plabel=document.getElementById('progressLabel');
  btn.disabled=true;btn.textContent='制作中…';
  note.textContent='正在上传 PDF…';
  document.getElementById('list').innerHTML='<div class="spinner"></div>';
  pwrap.style.display='block';pbar.style.width='0%';plabel.textContent='排队中…';
  try{
    const fd=new FormData();fd.append('file',f);
    const up=await (await fetch('/api/upload',{method:'POST',body:fd})).json();
    if(!up.ok){note.textContent='上传失败：'+(up.error||'');return;}
    const gen=await (await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pdf_path:up.pdf_path,preset:document.getElementById('preset').value})})).json();
    if(!gen.ok){note.textContent='生成失败：'+(gen.error||'');return;}
    // §2.6-4 ⭐ 长任务轮询：后台线程跑生成，前端轮询 /api/jobs/<job_id>，
    // 浏览器断连/刷新也不丢任务（服务端后台线程继续跑完）。
    const jobId=gen.job_id;
    note.textContent='任务已提交（job '+(jobId||'').slice(0,8)+'）——后台生成中，可安全刷新页面。';
    while(true){
      await new Promise(r=>setTimeout(r,1500));
      const st=await (await fetch('/api/jobs/'+encodeURIComponent(jobId))).json();
      if(!st.ok){note.textContent='查询任务失败：'+(st.error||'');break;}
      const pct=Math.max(0,Math.min(100,st.progress||0));
      pbar.style.width=pct+'%';
      plabel.textContent=(st.stage||'处理中')+' · '+pct+'%';
      if(st.status==='done'){
        pbar.style.width='100%';plabel.textContent='完成 · 100%';
        const r=st.result||{};
        lastHtml=r.html_path||'';lastPdf=r.pdf_path||'';lastAccessories=r.accessories||{};
        const t=(r.html_path||'').split(/[\\/]/).pop()||'词条列表';
        document.getElementById('bookTitle').textContent=t.replace('_词汇表.html','');
        const n=r.entries_count!=null?r.entries_count:0;
        note.textContent=`生成完成：${n} 词条 | 阶段 ${(r.completed_stages||[]).join(' · ')}`;
        if(r.html_path)document.getElementById('dlBtn').style.display='inline-block';
        page=1;loadEntries();
        break;
      }else if(st.status==='error'){
        note.textContent='生成失败：'+(st.error||'未知错误');
        break;
      }
    }
  }catch(e){
    note.textContent='请求失败：'+e;
  }finally{
    btn.disabled=false;btn.innerHTML=ic('zap',14)+' 制作词汇表';
  }
}

function debounceLoad(){clearTimeout(timer);timer=setTimeout(()=>{curQ=document.getElementById('search').value.trim();page=1;loadEntries();},300);}

async function loadEntries(){
  const q=new URLSearchParams({page:String(page),page_size:String(pageSize),status:curStatus});
  if(curQ)q.set('q',curQ);
  const r=await (await fetch('/api/entries?'+q)).json();
  if(!r.ok){return;}
  totalPages=r.pages||1;
  render(r.entries||[],r.total||0);
  document.getElementById('pageInfo').textContent=`第 ${r.page} / ${totalPages} 页 · 共 ${r.total} 词`;
  document.getElementById('prev').disabled=page<=1;
  document.getElementById('next').disabled=page>=totalPages;
  document.getElementById('pager').style.display='flex';
}

const CEFR_COLORS={A1:'#10b981',A2:'#22c55e',B1:'#eab308',B2:'#f97316',C1:'#ef4444',C2:'#7c3aed'};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(entries,total){
  const list=document.getElementById('list');
  if(!entries.length){list.innerHTML='<div class="empty">没有匹配的词条</div>';return;}
  list.innerHTML=entries.map(e=>{
    const srs=e.srs||'new';
    const cefr=(e.cefr||'').toUpperCase();
    const cefrHtml=cefr?`<span class="cefr" style="background:${CEFR_COLORS[cefr]||'#888'}">${cefr}</span>`:'';
    const freqHtml=e.freq>0?`<span class="freq">频 ${e.freq}</span>`:'';
    const exs=(e.examples||[]).map(x=>`<div class="ex">${esc(x.en||'')}<div class="zh">${esc(x.zh||'')}</div></div>`).join('');
    const cols=(e.collocations||[]).map(esc).join(' · ');
    return `<div class="entry ${srs}" onclick="toggleDetail(this)" data-word="${esc(e.headword)}">
      <div class="top">
        <span class="word">${esc(e.headword)}</span>
        ${e.pos?`<span class="pos">${esc(e.pos)}</span>`:''}
        ${e.ipa?`<span class="ipa">/${esc(e.ipa)}/</span>`:''}
        <span class="meta">${cefrHtml}${freqHtml}<span class="srs-dot ${srs}" title="${srs}"></span></span>
      </div>
      <div class="gloss">${esc(e.gloss_zh||'')}</div>
      ${e.gloss_en?`<div class="gloss-en">${esc(e.gloss_en)}</div>`:''}
      <div class="detail">
        ${e.etymology?`<div class="row"><span class="lab">词源</span> ${esc(e.etymology)}</div>`:''}
        ${exs?`<div class="row"><span class="lab">例句</span>${exs}</div>`:''}
        ${cols?`<div class="row"><span class="lab">搭配</span> ${cols}</div>`:''}
        <div class="srs-btns" onclick="event.stopPropagation()">
          <button class="srs-btn new ${srs==='new'?'active':''}" onclick="setSrs('${esc(e.headword)}','new')">${ic('dot-new')} 生词</button>
          <button class="srs-btn learning ${srs==='learning'?'active':''}" onclick="setSrs('${esc(e.headword)}','learning')">${ic('dot-learning')} 学习中</button>
          <button class="srs-btn mastered ${srs==='mastered'?'active':''}" onclick="setSrs('${esc(e.headword)}','mastered')">${ic('dot-mastered')} 已掌握</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleDetail(el){el.classList.toggle('open');}

async function setSrs(word,status){
  await fetch('/api/srs',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({word,status})});
  loadEntries();
}

function goPage(p){if(p<1||p>totalPages)return;page=p;loadEntries();window.scrollTo({top:0,behavior:'smooth'});}

function downloadFiles(){
  if(lastHtml)window.open('/api/download/'+encodeURIComponent(lastHtml.split(/[\\/]/).pop()));
  if(lastPdf)setTimeout(()=>window.open('/api/download/'+encodeURIComponent(lastPdf.split(/[\\/]/).pop())),500);
  Object.values(lastAccessories||{}).forEach((p,i)=>setTimeout(()=>window.open('/api/download/'+encodeURIComponent(String(p).split(/[\\/]/).pop())),1000+i*400));
}
</script>
</body>
</html>
