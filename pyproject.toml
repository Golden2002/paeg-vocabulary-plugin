[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paeg-vocabulary"
version = "0.1.0"
description = "PAEG 词汇表生成插件：书籍 PDF → 结构化语言学习词汇表（单词/音标/双语释义/词源/原书例句/短语搭配）+ 精美 Bell Jar CSS 渲染 + 词频/风格附件（可插拔、可扩展、可接入 PAEG 工具生态）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PAEG Team" }]
keywords = ["vocabulary", "language-learning", "glossary", "pdf", "etymology", "ipa", "mcp"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "pdfplumber>=0.11", "pypdf>=4.0", "ftfy>=6.0", "wordninja>=2.0"]
nlp = ["spacy>=3.7", "wordfreq>=3.0"]
tts = ["edge-tts>=6.0"]
mcp = ["fastmcp>=2"]
dev = ["pytest>=7"]

[project.scripts]
paeg-vocabulary-mcp = "paeg_vocabulary.mcp_server:main"

# §3.114 ⭐ src 布局 + 自动发现（pip install 成功 + 子包完整）
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["paeg_vocabulary*"]

[tool.setuptools.package-data]
paeg_vocabulary = ["data/*.json", "prompts/*.py"]
